<script>
        // 自動解析網址參數 (?name=xxx&id=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        const idParam = urlParams.get('id');

        // 讀取名字與編號（如果網址無帶參數，預設顯示賓客及代碼）
        const guestName = nameParam ? nameParam : '賓客';
        const checkInId = idParam ? idParam : '---';

        // 填入主頁面
        document.getElementById('guestName').innerText = nameParam ? "親愛的 " + nameParam : "親愛的賓客";
        document.getElementById('checkInID').innerText = checkInId;

        // 填入 Pop-up 彈出視窗
        document.getElementById('popupGuestName').innerText = guestName;
        document.getElementById('popupCheckInID').innerText = checkInId;

        // 網頁開啟 1.5 秒 (1500ms) 後「自動彈出」高質感名牌 Popup
        window.addEventListener('load', () => {
            setTimeout(() => {
                openModal();
            }, 1500);
        });

        // 彈窗控制 Function
        function openModal() {
            document.getElementById('popupModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('popupModal').classList.remove('active');
        }
    </script>
